:root[data-size="2"]{--fs:1.375rem}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
body{background:var(--chao);color:var(--tinta);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--chao)}
.wrap{max-width:720px;margin:0 auto;padding-block:0 4rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lago);outline-offset:2px;border-radius:6px}
a{color:var(--lago)}

/* topo */
.topo{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--chao);
  display:flex;align-items:center;gap:.5rem;padding-block:.75rem;border-bottom:1px solid var(--linha);margin-bottom:1.25rem}
.marca{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.marca b{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca small{color:var(--tinta-2);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.ico{width:40px;height:40px;border-radius:10px;border:1px solid var(--linha);background:var(--papel);display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico .aa{font-family:var(--f-texto);font-weight:600;font-size:1rem}
.citacao{white-space:nowrap;hyphens:manual}

/* início */
.monte{position:relative;border-radius:18px;overflow:hidden;background:var(--ceu);border:1px solid var(--linha)}
.monte svg{display:block;width:100%;height:auto}
.monte .t{position:absolute;left:1.1rem;top:1rem;right:1.1rem;pointer-events:none}
.monte h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1;letter-spacing:-.03em;margin:0;text-wrap:balance}
.monte p{margin:.35rem 0 0;color:var(--tinta-2);font-size:.9rem;max-width:22ch}
.marco{cursor:pointer}
.marco circle{transition:r .15s}
.marco:hover circle.p,.marco:focus-visible circle.p{r:8}
.marco.atual circle.halo{animation:pulso 2.2s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:.15;r:9}50%{opacity:.45;r:13}}
@media (prefers-reduced-motion: reduce){.marco.atual circle.halo{animation:none;opacity:.3}}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin:.75rem 0 1.5rem}
.stat{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:.6rem .75rem}
.stat b{display:block;font-family:var(--f-display);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--tinta-2)}

.hoje{background:var(--lago);color:var(--chao);border-radius:18px;padding:1.25rem;display:grid;gap:.6rem;margin-bottom:2rem}
.hoje .eb{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.hoje h2{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.15;margin:0;text-wrap:balance}
.hoje q{font-family:var(--f-texto);font-style:italic;opacity:.92;quotes:"\201C" "\201D"}
.hoje .ref{font-size:.85rem;opacity:.85}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:0;border-radius:999px;padding:.75rem 1.25rem;font-weight:700;font-size:.95rem}
.btn.claro{background:var(--chao);color:var(--lago)}
.btn.prim{background:var(--lago);color:var(--chao)}
.btn.sec{background:transparent;border:1px solid var(--linha);color:var(--tinta)}
.btn.trigo{background:var(--trigo);color:var(--chao)}

.cap{margin:2rem 0 .5rem;display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.cap h3{font-family:var(--f-display);font-size:1.15rem;margin:0}
.cap span{color:var(--tinta-2);font-size:.85rem}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:2px;border-radius:14px;overflow:hidden;border:1px solid var(--linha);background:var(--linha)}
.lista button{width:100%;display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;align-items:center;gap:.75rem;text-align:left;background:var(--papel);border:0;padding:.75rem .9rem}
.lista button:hover{background:var(--chao)}
.num{font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--tinta-2);font-variant-numeric:tabular-nums;text-align:center}
.lista .tt{font-weight:600;line-height:1.25}
.lista .ps{font-size:.8rem;color:var(--tinta-2)}
.chip{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:.2rem .55rem;white-space:nowrap}
.chip.ok{background:color-mix(in srgb, var(--ok) 16%, transparent);color:var(--ok)}
.chip.hj{background:var(--trigo-suave);color:var(--trigo)}
li.feito .num{color:var(--ok)}
.links{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:2rem}

/* dia */
.voltar{background:none;border:0;padding:0;color:var(--tinta-2);font-size:.9rem;display:inline-flex;gap:.3rem;align-items:center}
.cab-dia{margin:.75rem 0 1rem}
.cab-dia .eb{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--trigo);font-weight:700}
.cab-dia h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.55rem,5.5vw,2.2rem);line-height:1.08;letter-spacing:-.025em;margin:.2rem 0 0;text-wrap:balance}
.passos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:1rem 0 .4rem}
.passos button{height:28px;border:0;background:none;padding:0;display:flex;align-items:center}
.passos button i{display:block;width:100%;height:5px;border-radius:3px;background:var(--linha)}
.passos button.vist i{background:var(--lago)}
.passos button.at i{background:var(--trigo)}
.rotulo{display:flex;justify-content:space-between;font-size:.8rem;color:var(--tinta-2);gap:1rem}
.modo{background:none;border:0;padding:0;color:var(--lago);font-size:.8rem;font-weight:700}

.secao{background:var(--papel);border:1px solid var(--linha);border-radius:18px;padding:1.4rem 1.25rem;margin-top:1rem;min-width:0}
.secao h2{font-family:var(--f-display);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--lago);margin:0 0 .75rem}
.secao p{font-family:var(--f-texto);font-size:var(--fs);line-height:1.7;margin:0;max-width:65ch;hyphens:auto}
.secao p + p{margin-top:.9rem}
mark{background:var(--trigo-suave);color:inherit;padding:.05em .15em;border-radius:3px}
.leia{text-align:center;padding-block:1.6rem}
.leia .ref{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,3rem);letter-spacing:-.03em;line-height:1;color:var(--tinta)}
.leia .v{display:inline-block;margin-top:.5rem;font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--trigo);border:1px solid var(--trigo);border-radius:999px;padding:.15rem .6rem}
.leia p{margin:1rem auto 0;max-width:38ch;font-size:calc(var(--fs) * .92);color:var(--tinta-2)}
.check{display:inline-flex;align-items:center;gap:.55rem;margin-top:1.25rem;font-weight:600;cursor:pointer;user-select:none}
.check input{width:20px;height:20px;accent-color:var(--lago)}
.verso{margin:1.1rem 0 0;padding:1rem 1.1rem;border-radius:12px;background:var(--lago-suave);display:grid;gap:.5rem}
.verso blockquote{margin:0;font-family:var(--f-texto);font-style:italic;font-size:calc(var(--fs) * 1.05);line-height:1.55}
.verso footer{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.8rem;color:var(--tinta-2)}
.mini{background:none;border:1px solid var(--linha);border-radius:999px;padding:.25rem .7rem;font-size:.78rem;font-weight:600;color:var(--lago)}
.oracao p{font-style:italic}
.oracao{background:color-mix(in srgb, var(--trigo-suave) 55%, var(--papel))}
.perg{display:grid;gap:.75rem}
.perg div{border-radius:12px;padding:.9rem 1rem;border:1px solid var(--linha)}
.perg b{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--trigo);margin-bottom:.3rem}
.perg p{font-size:calc(var(--fs) * .98)}
label.nt{display:block;font-size:.8rem;font-weight:700;color:var(--tinta-2);margin:1.2rem 0 .4rem}
textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--linha);background:var(--chao);color:var(--tinta);padding:.75rem;font-family:var(--f-texto);font-size:1rem;line-height:1.55;resize:vertical}
.salvo{font-size:.75rem;color:var(--tinta-2);min-height:1.2em;margin-top:.25rem}
.nav-dia{display:flex;justify-content:space-between;gap:.5rem;margin-top:1.25rem;flex-wrap:wrap}
.nav-dia .btn{flex:1 1 auto}
.concluido{margin-top:1rem;padding:.8rem 1rem;border-radius:12px;background:color-mix(in srgb, var(--ok) 12%, var(--papel));color:var(--ok);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.concluido button{background:none;border:0;color:var(--tinta-2);text-decoration:underline;font-size:.8rem;padding:0}
.entre{display:flex;justify-content:space-between;gap:.5rem;margin-top:1.75rem;font-size:.85rem}
.entre button{background:none;border:0;padding:.3rem 0;color:var(--tinta-2);text-align:left;max-width:48%}
.entre button:last-child{text-align:right}
.entre b{display:block;color:var(--tinta)}

/* páginas de texto */
.pagina h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;letter-spacing:-.02em;margin:.5rem 0 1rem}
.assin{font-size:.9rem;color:var(--tinta-2);margin-top:1.2rem}
.nota-item{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:1rem;margin-top:.75rem}
.nota-item button{background:none;border:0;padding:0;font-weight:700;color:var(--lago);text-align:left}
.nota-item p{font-family:var(--f-texto);white-space:pre-wrap;margin:.4rem 0 0}
.vazio{color:var(--tinta-2);font-family:var(--f-texto)}
.perigo{margin-top:2.5rem;border-top:1px solid var(--linha);padding-top:1rem;font-size:.9rem;color:var(--tinta-2)}
.perigo .btn{margin-top:.5rem}

/* celebração */
.cel{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb, var(--chao) 92%, transparent);
  padding:1rem max(16px, env(safe-area-inset-right, 0px)) calc(1rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.cel .box{background:var(--papel);border:1px solid var(--linha);border-radius:20px;padding:1.6rem 1.4rem;max-width:400px;width:100%;text-align:center;display:grid;gap:.8rem;animation:sobe .35s ease-out}
.cel h2{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0}
.cel p{margin:0;font-family:var(--f-texto);color:var(--tinta-2)}
.cel svg{width:120px;height:auto;margin:0 auto}
@keyframes sobe{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.cel .box{animation:none}}
.rodape{margin-top:3rem;font-size:.78rem;color:var(--tinta-2);text-align:center}
</style>

   "contexto": "O Sermão termina, e a multidão não fica discutindo técnicas. Fica maravilhada, porque Jesus não ensina como os mestres da lei: ele ensina com autoridade. Estas duas últimas frases nos deixam diante da Pessoa, não de um método.",
   "ideia": "A NVT registra: \"Quando Jesus acabou de dizer essas coisas, a multidão ficou maravilhada com seu ensino, pois ele ensinava com verdadeira autoridade, diferentemente dos mestres da lei\" (Mt 7.28-29, NVT). Ao longo destes 30 dias, vimos o Reino que começa na dependência, a justiça que vai ao coração, a vida diante do Pai, o tesouro e a confiança de cada dia, o modo de tratar o próximo e o chamado a entrar pela porta estreita, a dar fruto e a construir sobre a rocha. Tudo isso tem peso porque quem fala é o Senhor. A autoridade dele não nos esmaga: ela nos convida a continuar ouvindo a sua voz.",
   "aplicacao": "O próximo passo não é encerrar um compromisso e guardar o material. É continuar lendo os Evangelhos — o próprio Mateus segue, e também Marcos, Lucas e João — para permanecer diante de Jesus. Escolha, hoje, quando e onde a sua família vai abrir o próximo capítulo. Em casa, agradeçam juntos pelo que ouviram nestes 30 dias e peçam graça para praticar.",
   "oracao": "Senhor Jesus, tu ensinas com autoridade, e as tuas palavras nos dão vida. Obrigado por estes 30 dias. Mantém a nossa família perto de ti, ouvindo e praticando, por pura graça. Amém.",
   "adultos": "O que destes 30 dias o Senhor mais destacou para você, e qual será o próximo passo na leitura dos Evangelhos?",
   "criancas": "O que você aprendeu sobre Jesus nestes dias, e o que você quer continuar fazendo?",
   "verso": "Quando Jesus acabou de dizer essas coisas, a multidão ficou maravilhada com seu ensino, pois ele ensinava com verdadeira autoridade, diferentemente dos mestres da lei",
   "versoRef": "Mt 7.28-29, NVT"
  }
 ]
}</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('dados').textContent);
const DIAS = D.days;
const CAPS = [
  {cap:'Mateus 5', sub:'O Reino que começa na dependência e a justiça que vai ao coração', de:1, ate:12},
  {cap:'Mateus 6', sub:'A vida diante do Pai, o tesouro e a confiança de cada dia', de:13, ate:22},
  {cap:'Mateus 7', sub:'O próximo, a porta estreita, os frutos e a rocha', de:23, ate:30}
];
const PASSOS = [
  {k:'leitura', n:'Leitura'}, {k:'contexto', n:'Contexto'}, {k:'ideia', n:'Ideia-chave'},
  {k:'aplicacao', n:'Aplicação'}, {k:'oracao', n:'Oração'}, {k:'familia', n:'Em família'}
];
const CHAVE = 'sermao-monte-30';
let S = {feitos:{}, notas:{}, lidos:{}, passo:{}, tamanho:0, tema:null, tudo:false};
try { const s = JSON.parse(localStorage.getItem(CHAVE)); if (s) S = Object.assign(S, s); } catch(e){}
function salvar(){ try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch(e){} }

const root = document.documentElement;
function aplicaPrefs(){
  root.dataset.size = String(S.tamanho||0);
  if (S.tema) root.dataset.theme = S.tema; else delete root.dataset.theme;
}
aplicaPrefs();

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoje = () => new Date().toISOString().slice(0,10);
const nFeitos = () => Object.keys(S.feitos).length;
const proximo = () => { for (const d of DIAS) if (!S.feitos[d.n]) return d.n; return 30; };
function marcaVerso(txt, verso){
  let h = esc(txt);
  if (verso){ const v = esc(verso); h = h.replace('&quot;'+v+'&quot;', '<mark>&quot;'+v+'&quot;</mark>'); }
  return marcaRef(h);
}
/* Citações bíblicas (ex.: "Mt 4.23-25", "vv. 10-11", "Mt 5.23-24; 6.14-15", "Mt 7.28-29, NVT"):
   aplicado em texto JÁ escapado; envolve em span nowrap, nbsp entre livro e capítulo, hífen inquebrável (U+2011) na faixa. */
const LIVRO = '(?:[1-3] ?)?(?:Gn|Êx|Ex|Lv|Nm|Dt|Js|Jz|Rt|Sm|Rs|Cr|Ed|Ne|Et|Jó|Sl|Pv|Ec|Ct|Is|Jr|Lm|Ez|Dn|Os|Jl|Am|Ob|Jn|Mq|Na|Hc|Sf|Ag|Zc|Ml|Mt|Mc|Lc|Jo|At|Rm|Co|Gl|Ef|Fp|Cl|Ts|Tm|Tt|Fm|Hb|Tg|Pe|Jd|Ap'
  + '|Gênesis|Êxodo|Levítico|Números|Deuteronômio|Josué|Juízes|Rute|Samuel|Reis|Crônicas|Esdras|Neemias|Ester|Salmos?|Provérbios|Eclesiastes|Cantares'
  + '|Isaías|Jeremias|Lamentações|Ezequiel|Daniel|Oseias|Joel|Amós|Obadias|Jonas|Miqueias|Naum|Habacuque|Sofonias|Ageu|Zacarias|Malaquias'
  + '|Mateus|Marcos|Lucas|João|Atos|Romanos|Coríntios|Gálatas|Efésios|Filipenses|Colossenses|Tessalonicenses|Timóteo|Tito|Filemom|Hebreus|Tiago|Pedro|Judas|Apocalipse)';
const RE_REF = new RegExp('(?<![\\p{L}\\d])(?:' + LIVRO + '[ \u00A0]\\d+(?:\\.\\d+(?:-\\d+(?:\\.\\d+)?)?|-\\d+)|vv?\\.[ \u00A0]\\d+(?:-\\d+)?)'
  + '(?:[;,] \\d+(?:\\.\\d+)?(?:-\\d+(?:\\.\\d+)?)?(?![\\p{L}\\d]|\\.\\d))*'
  + '(?:, (?:NVT|NVI|ARA|ARC|NAA|NTLH|ACF|KJA)(?![\\p{L}\\d]))?', 'gu');
function marcaRef(h){
  return h.replace(RE_REF, m => '<span class="citacao">'
    + m.replace(/(\p{L}\.?) (?=\d)/gu, '$1\u00A0').replace(/(\d)-(?=\d)/g, '$1\u2011') + '</span>');
}
function dataBR(iso){ const [a,m,d] = iso.split('-'); return d+'/'+m+'/'+a; }

/* ---------- monte ---------- */
function montanha(atual){
  const W=360, H=330, base=312, pico=168, cx=180, larg=98;
  const alt = base - pico;
  const hillY = x => base - alt*Math.exp(-Math.pow((x-cx)/larg,2));
  let d = 'M0 '+H+' L0 '+hillY(0).toFixed(1);
  for (let x=0;x<=W;x+=6) d += ' L'+x+' '+hillY(x).toFixed(1);
  d += ' L'+W+' '+H+' Z';
  const hill2 = x => base+6 - 95*Math.exp(-Math.pow((x-300)/70,2)) - 70*Math.exp(-Math.pow((x-40)/60,2));
  let d2 = 'M0 '+H; for (let x=0;x<=W;x+=6) d2 += ' L'+x+' '+hill2(x).toFixed(1); d2 += ' L'+W+' '+H+' Z';
  // trilha em zigue-zague até o pico
  const pts=[];
  for (let i=0;i<=400;i++){
    const t=i/400, y=base-6 - t*(alt-10);
    const h=(base-y)/alt, w=larg*Math.sqrt(Math.max(0,-Math.log(Math.max(h,1e-4))));
    const x=cx + 0.62*w*Math.sin(t*Math.PI*4.5 - Math.PI/2);
    pts.push([x,y]);
  }
  const len=[0]; for(let i=1;i<pts.length;i++) len.push(len[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const tot=len[len.length-1];
  const marcos=[];
  for(let k=0;k<30;k++){
    const alvo=tot*(k/29); let i=1; while(i<len.length-1 && len[i]<alvo) i++;
    marcos.push(pts[i]);
  }
  const trilha='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
  let lim = 0; for (let k=1;k<=30;k++) if (S.feitos[k]) lim = k;
  const ate = Math.max(lim,0);
  let feitoLen = ate? tot*((ate-1)/29) : 0;
  let m = '';
  marcos.forEach((p,i)=>{
    const n=i+1, f=!!S.feitos[n], a=n===atual;
    m += '<g class="marco'+(a?' atual':'')+'" tabindex="0" role="link" data-dia="'+n+'" aria-label="Dia '+n+(f?', concluído':'')+'">'
      + '<title>Dia '+n+': '+esc(DIAS[i].title)+'</title>'
      + (a?'<circle class="halo" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="11" fill="var(--trigo)"/>':'')
      + '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="12" fill="transparent"/>'
      + '<circle class="p" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(a?6.5:5)+'" fill="'+(f?'var(--lago)':a?'var(--trigo)':'var(--papel)')+'" stroke="'+(f?'var(--lago)':a?'var(--trigo)':'var(--tinta-2)')+'" stroke-width="1.5"/>'
      + '</g>';
  });
  const top = marcos[29];
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Trilha de 30 dias subindo o monte, '+nFeitos()+' concluídos">'
    + '<circle cx="300" cy="150" r="20" fill="var(--trigo-suave)"/>'
    + '<path d="'+d2+'" fill="var(--monte-1)"/>'
    + '<path d="'+d+'" fill="var(--monte-2)"/>'
    + '<rect x="0" y="'+(H-14)+'" width="'+W+'" height="14" fill="var(--lago)" opacity=".55"/>'
    + '<path d="'+trilha+'" fill="none" stroke="var(--papel)" stroke-width="2.2" stroke-dasharray="3 4" stroke-linecap="round" opacity=".9"/>'
    + (feitoLen? '<path d="'+trilha+'" fill="none" stroke="var(--lago)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="'+feitoLen.toFixed(1)+' '+tot.toFixed(1)+'"/>' : '')
    + '<path d="M'+(top[0]).toFixed(1)+' '+(top[1]-6).toFixed(1)+' l0 -16 l11 4 l-11 4" fill="var(--trigo)" stroke="var(--trigo)" stroke-width="1.4" stroke-linejoin="round"/>'
    + m + '</svg>';
}

/* ---------- telas ---------- */
function telaInicio(){
  const at = proximo(), d = DIAS[at-1], tudoFeito = nFeitos()===30;
  const ult = Object.values(S.feitos).sort().pop();
  let h = '<section class="monte">'+montanha(at)
    + '<div class="t"><h1>Sermão<br>do Monte</h1><p>Mateus 5 a 7, um dia de cada vez, em casa e em família.</p></div></section>';
  h += '<div class="stats">'
    + '<div class="stat"><b>'+nFeitos()+'/30</b><span>dias concluídos</span></div>'
    + '<div class="stat"><b>'+Math.round(nFeitos()/30*100)+'%</b><span>da subida</span></div>'
    + '<div class="stat"><b>'+(ult?dataBR(ult).slice(0,5):'Hoje')+'</b><span>'+(ult?'última leitura':'bom começo')+'</span></div></div>';
  h += '<section class="hoje" aria-label="Próxima leitura">'
    + '<span class="eb">'+(tudoFeito?'Você chegou ao topo':(nFeitos()?'Continue de onde parou':'Comece por aqui'))+' · Dia '+at+'</span>'
    + '<h2>'+esc(d.title)+'</h2>'
    + (d.verso?'<q>'+esc(d.verso)+'</q><span class="ref">'+marcaRef(esc(d.versoRef))+'</span>':'')
    + '<div><button class="btn claro" data-dia="'+at+'">'+(tudoFeito?'Reler o Dia 30':'Abrir o Dia '+at)+' →</button></div></section>';
  CAPS.forEach(c=>{
    const feitosCap = DIAS.filter(x=>x.n>=c.de&&x.n<=c.ate&&S.feitos[x.n]).length;
    h += '<div class="cap"><h3>'+c.cap+'</h3><span>Dias '+c.de+' a '+c.ate+' · '+feitosCap+'/'+(c.ate-c.de+1)+'</span></div>'
      + '<p style="margin:0 0 .6rem;color:var(--tinta-2);font-size:.88rem">'+c.sub+'</p><ul class="lista">';
    DIAS.filter(x=>x.n>=c.de&&x.n<=c.ate).forEach(x=>{
      const f=!!S.feitos[x.n];
      h += '<li class="'+(f?'feito':'')+'"><button data-dia="'+x.n+'"><span class="num">'+(f?'✓':x.n)+'</span>'
        + '<span><span class="tt">'+esc(x.title)+'</span><br><span class="ps">Dia '+x.n+' · '+marcaRef(esc(x.passage))+'</span></span>'
        + (f?'<span class="chip ok">Feito</span>':x.n===at?'<span class="chip hj">Agora</span>':'<span></span>')+'</button></li>';
    });
    h += '</ul>';
  });
  h += '<div class="links"><button class="btn sec" data-ir="como-usar">Como usar este devocional</button>'
    + '<button class="btn sec" data-ir="anotacoes">Minhas anotações ('+Object.values(S.notas).filter(v=>v&&v.trim()).length+')</button></div>';
  app.innerHTML = h;
}

function paragrafos(txt, verso){
  return txt.split(/(?<=[.!?"])\s+(?=(?:Em casa|Em família|Hoje|Ao mesmo tempo|Se |Por isso|O aviso|Mas,|Isso alcança|Essa seriedade|A obediência|O discípulo não|Jesus não pede|Tudo isso)\b)/).map(p=>'<p>'+marcaVerso(p, verso)+'</p>').join('');
}

function telaDia(n){
  const d = DIAS[n-1]; if (!d) return telaInicio();
  let p = S.passo[n] || 0; if (S.feitos[n] && S.passo[n]==null) p = 0;
  const tudo = S.tudo;
  const sec = {
    leitura: '<section class="secao leia" data-s="0"><h2>Leia na sua Bíblia</h2><div class="ref">'+marcaRef(esc(d.passage))+'</div><span class="v">NVT</span>'
      + '<p>Abra a sua Bíblia e leia a passagem inteira antes de seguir. O devocional ajuda; a Palavra vem primeiro.</p>'
      + '<label class="check"><input type="checkbox" id="lido-'+n+'"'+(S.lidos[n]?' checked':'')+'> Já li a passagem</label></section>',
    contexto: '<section class="secao" data-s="1"><h2>Contexto</h2>'+paragrafos(d.contexto, d.verso)+'</section>',
    ideia: '<section class="secao" data-s="2"><h2>Ideia-chave</h2>'+paragrafos(d.ideia, d.verso)
      + (d.verso?'<div class="verso"><blockquote>“'+esc(d.verso)+'”</blockquote><footer><span>'+marcaRef(esc(d.versoRef))+'</span><button class="mini" data-copiar="'+n+'">Copiar versículo</button></footer></div>':'')+'</section>',
    aplicacao: '<section class="secao" data-s="3"><h2>Aplicação</h2>'+paragrafos(d.aplicacao)+'</section>',
    oracao: '<section class="secao oracao" data-s="4"><h2>Oração</h2><p>'+marcaRef(esc(d.oracao))+'</p></section>',
    familia: '<section class="secao" data-s="5"><h2>Momento em família</h2><div class="perg">'
      + '<div><b>Para os adultos</b><p>'+marcaRef(esc(d.adultos))+'</p></div>'
      + '<div><b>Para as crianças</b><p>'+marcaRef(esc(d.criancas))+'</p></div></div>'
      + '<label class="nt" for="nota-'+n+'">Anotações do dia (o que conversamos, o que Deus falou)</label>'
      + '<textarea id="nota-'+n+'" placeholder="Escreva aqui. Fica guardado neste aparelho.">'+esc(S.notas[n]||'')+'</textarea><div class="salvo" id="salvo"></div></section>'
  };
  let h = '<button class="voltar" data-ir="inicio">← Todos os dias</button>'
    + '<div class="cab-dia"><span class="eb">Dia '+n+' de 30 · '+marcaRef(esc(d.passage))+'</span><h1>'+esc(d.title)+'</h1></div>';
  if (!tudo){
    h += '<div class="passos" role="tablist">'+PASSOS.map((s,i)=>'<button role="tab" aria-selected="'+(i===p)+'" aria-label="'+s.n+'" data-passo="'+i+'" class="'+(i===p?'at':i<p?'vist':'')+'"><i></i></button>').join('')+'</div>'
      + '<div class="rotulo"><span>'+(p+1)+' de 6 · <b>'+PASSOS[p].n+'</b></span><button class="modo" data-tudo="1">Ver o dia inteiro</button></div>';
    h += sec[PASSOS[p].k];
    h += '<div class="nav-dia">'
      + (p>0?'<button class="btn sec" data-passo="'+(p-1)+'">← '+PASSOS[p-1].n+'</button>':'')
      + (p<5?'<button class="btn prim" data-passo="'+(p+1)+'">'+PASSOS[p+1].n+' →</button>'
            : (S.feitos[n]?'<button class="btn prim" data-dia="'+(n<30?n+1:'')+'" '+(n<30?'':'data-ir="inicio"')+'>'+(n<30?'Ir para o Dia '+(n+1)+' →':'Voltar ao monte')+'</button>'
                          :'<button class="btn trigo" data-concluir="'+n+'">Concluir o Dia '+n+'</button>'))
      + '</div>';
  } else {
    h += '<div class="rotulo" style="margin-top:.5rem"><span>Dia inteiro</span><button class="modo" data-tudo="0">Ler passo a passo</button></div>';
    h += PASSOS.map(s=>sec[s.k]).join('');
    h += '<div class="nav-dia">'+(S.feitos[n]?'':'<button class="btn trigo" data-concluir="'+n+'">Concluir o Dia '+n+'</button>')+'</div>';
  }
  if (S.feitos[n]) h += '<div class="concluido"><span>✓ Concluído em '+dataBR(S.feitos[n])+'</span><button data-desfazer="'+n+'">Desmarcar</button></div>';
  h += '<nav class="entre">'
    + (n>1?'<button data-dia="'+(n-1)+'">← Dia '+(n-1)+'<b>'+esc(DIAS[n-2].title)+'</b></button>':'<span></span>')
    + (n<30?'<button data-dia="'+(n+1)+'">Dia '+(n+1)+' →<b>'+esc(DIAS[n].title)+'</b></button>':'<span></span>')
    + '</nav>';
  app.innerHTML = h;
  const ta = document.getElementById('nota-'+n);
  if (ta){ let t; ta.addEventListener('input', ()=>{ S.notas[n]=ta.value; clearTimeout(t); t=setTimeout(()=>{ salvar(); const s=document.getElementById('salvo'); if(s) s.textContent='Anotação guardada neste aparelho.'; },400); }); }
  const lido = document.getElementById('lido-'+n);
  if (lido) lido.addEventListener('change', ()=>{ S.lidos[n]=lido.checked; salvar(); });
}

function telaComoUsar(){
  const partes = D.intro.split(/\s(?=Um princípio guia|Como usar cada dia|Depois da leitura|Uma sugestão de horário|Se perder um dia|O trecho de Mateus|Que o Senhor use|Eliomar Marcolino \|)/);
  const assin = partes.pop();
  app.innerHTML = '<button class="voltar" data-ir="inicio">← Todos os dias</button><article class="pagina"><h1>Como usar</h1>'
    + '<section class="secao">'+partes.map(p=>'<p>'+marcaRef(esc(p))+'</p>').join('')+'<p class="assin">'+esc(assin)+'</p></section></article>'
    + '<div class="perigo" id="perigo">Quer recomeçar a subida? Isso apaga as marcações de dias concluídos neste aparelho. As anotações ficam.<br><button class="btn sec" id="zerar">Recomeçar do Dia 1</button></div>';
  document.getElementById('zerar').onclick = function(){
    const box = document.getElementById('perigo');
    box.innerHTML = 'Tem certeza? Os '+nFeitos()+' dias concluídos voltam a ficar em aberto.<br>'
      + '<button class="btn trigo" id="sim">Sim, recomeçar</button> <button class="btn sec" id="nao">Cancelar</button>';
    document.getElementById('sim').onclick = ()=>{ S.feitos={}; S.passo={}; S.lidos={}; salvar(); ir('inicio'); };
    document.getElementById('nao').onclick = telaComoUsar;
  };
}

function telaNotas(){
  const ns = DIAS.filter(d=>S.notas[d.n] && S.notas[d.n].trim());
  app.innerHTML = '<button class="voltar" data-ir="inicio">← Todos os dias</button><article class="pagina"><h1>Minhas anotações</h1>'
    + (ns.length? ns.map(d=>'<div class="nota-item"><button data-dia="'+d.n+'" data-passo-ir="5">Dia '+d.n+' · '+esc(d.title)+'</button><p>'+esc(S.notas[d.n])+'</p></div>').join('')
      : '<p class="vazio">Ainda não há anotações. No passo “Em família” de cada dia há um espaço para escrever o que vocês conversaram.</p>')
    + '</article>';
}

function celebrar(n){
  const cel = document.getElementById('cel');
  const fim = nFeitos()===30;
  cel.innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-labelledby="cel-t">'
    + '<svg viewBox="0 0 120 70" aria-hidden="true"><path d="M0 70 L0 62 C30 58 45 20 60 12 C75 20 90 58 120 62 L120 70Z" fill="var(--monte-2)"/><path d="M60 12 l0 -11 l9 3.5 l-9 3.5" fill="var(--trigo)" stroke="var(--trigo)" stroke-width="1.2"/><circle cx="'+(14+ (n-1)/29*46).toFixed(1)+'" cy="'+(62-(n-1)/29*50).toFixed(1)+'" r="4.5" fill="var(--lago)"/></svg>'
    + '<h2 id="cel-t">'+(fim?'Os 30 dias, concluídos':'Dia '+n+' concluído')+'</h2>'
    + '<p>'+(fim?'Que a voz de Jesus continue sendo ouvida na sua casa. O próximo passo é seguir nos Evangelhos.'
        :'Mais um passo monte acima. Amanhã, o Dia '+(n+1)+': '+esc(DIAS[n].title)+'.')+'</p>'
    + '<button class="btn prim" id="cel-ok">'+(fim?'Ver o monte':'Voltar ao monte')+'</button></div>';
  cel.hidden = false;
  document.getElementById('cel-ok').focus();
  document.getElementById('cel-ok').onclick = ()=>{ cel.hidden = true; ir('inicio'); };
}

/* ---------- rotas e eventos ---------- */
function ir(rota){ if (location.hash !== '#'+rota) location.hash = rota; else render(); }
function render(){
  const r = location.hash.slice(1) || 'inicio';
  const m = r.match(/^dia-(\d+)$/);
  if (m) telaDia(Math.min(30, Math.max(1, +m[1])));
  else if (r==='como-usar') telaComoUsar();
  else if (r==='anotacoes') telaNotas();
  else telaInicio();
}
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-dia],[data-ir],[data-passo],[data-concluir],[data-desfazer],[data-tudo],[data-copiar]');
  if (!b) return;
  const n = +(location.hash.match(/dia-(\d+)/)||[])[1];
  if (b.dataset.copiar){
    const d = DIAS[+b.dataset.copiar-1], txt = '“'+d.verso+'” ('+d.versoRef+')';
    const ok = ()=>{ b.textContent='Copiado'; setTimeout(()=>b.textContent='Copiar versículo',1600); };
    const falha = ()=>{ b.textContent='Não foi possível copiar'; setTimeout(()=>b.textContent='Copiar versículo',2000); };
    const antigo = ()=>{ try { const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const r=document.execCommand('copy'); ta.remove(); r ? ok() : falha(); } catch(_){ falha(); } };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, antigo); else antigo(); } catch(_){ antigo(); }
    return;
  }
  if (b.dataset.concluir){ const k=+b.dataset.concluir; S.feitos[k]=hoje(); S.passo[k]=5; salvar(); render(); celebrar(k); return; }
  if (b.dataset.desfazer){ delete S.feitos[+b.dataset.desfazer]; salvar(); render(); return; }
  if (b.dataset.tudo){ S.tudo = b.dataset.tudo==='1'; salvar(); render(); return; }
  if (b.dataset.dia){ if (b.dataset.passoIr) { S.passo[+b.dataset.dia]=+b.dataset.passoIr; S.tudo=false; } ir('dia-'+b.dataset.dia); return; }
  if (b.dataset.ir){ ir(b.dataset.ir); return; }
  if (b.dataset.passo != null && n){ S.passo[n]=+b.dataset.passo; salvar(); render(); document.querySelector('.cab-dia')?.scrollIntoView({block:'start'}); window.scrollBy(0,-80); }
});
document.addEventListener('keydown', e=>{
  const g = e.target.closest && e.target.closest('.marco');
  if (g && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); ir('dia-'+g.dataset.dia); return; }
  const m = location.hash.match(/dia-(\d+)/); if (!m || S.tudo || /TEXTAREA|INPUT/.test(e.target.tagName)) return;
  const n=+m[1], p=S.passo[n]||0;
  if (e.key==='ArrowRight' && p<5){ S.passo[n]=p+1; salvar(); render(); }
  if (e.key==='ArrowLeft' && p>0){ S.passo[n]=p-1; salvar(); render(); }
});
let x0=null, y0=null;
app.addEventListener('touchstart', e=>{ if (e.target.closest('textarea')) return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
app.addEventListener('touchend', e=>{
  if (x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
  const m = location.hash.match(/dia-(\d+)/); if (!m || S.tudo || Math.abs(dx)<70 || Math.abs(dy)>Math.abs(dx)*.6) return;
  const n=+m[1], p=S.passo[n]||0, q = dx<0? Math.min(5,p+1) : Math.max(0,p-1);
  if (q!==p){ S.passo[n]=q; salvar(); render(); }
}, {passive:true});

document.getElementById('ir-inicio').onclick = ()=>ir('inicio');
document.getElementById('bt-fonte').onclick = ()=>{ S.tamanho = ((S.tamanho||0)+1)%3; aplicaPrefs(); salvar(); };
document.getElementById('bt-tema').onclick = ()=>{
  const escuro = S.tema ? S.tema==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.tema = escuro ? 'light' : 'dark'; aplicaPrefs(); salvar();
};
render();
})();
</script>
