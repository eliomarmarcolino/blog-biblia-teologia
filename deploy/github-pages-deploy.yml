# Deploy para GitHub Pages — DESLIGADO por padrão.
# Só roda manualmente (workflow_dispatch). Não há gatilho em push nem em pull_request.
name: Deploy para GitHub Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Coerente com astro.config.mjs (SITE e BASE).
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
